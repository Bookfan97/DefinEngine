# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: Build and Release

on:
  workflow_dispatch: {}
  push:
    branches: [ "main" ]
    
permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: deployment-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify-local:
    name: Verify local Linux build
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, definengine-linux]
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: cmake -S . -B build -DCMAKE_PROJECT_VERSION=0.0.1 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  lint:
    name: C++ Linting
    runs-on: [self-hosted, Linux, X64, definengine-linux]
    if: "github.event_name != 'workflow_dispatch' && !contains(github.event.head_commit.message, 'style: apply linting fixes')"
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.LINT_PAT }}

      - name: Install Dependencies
        run: |
          cmake --version
          clang-format --version
          pkg-config --exists x11 xrandr xi wayland-client xkbcommon

      - name: Generate compilation database
        shell: bash
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_PROJECT_VERSION=0.0.1 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run cpp-linter (Report)
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.LINT_PAT }}
        run: |
          export PATH="/opt/cpp-linter/bin:$PATH"
          /opt/cpp-linter/bin/cpp-linter \
            --style file \
            --version 21 --jobs 2 \
            --tidy-checks='-*,bugprone-*,clang-analyzer-*,google-*,modernize-*,performance-*,portability-*,readability-*,-modernize-use-trailing-return-type,-readability-identifier-length,-readability-uppercase-literal-suffix' \
            --files-changed-only false --thread-comments true --step-summary true \
            --database build --ignore 'engine/thirdparty|build|cmake-build-*'

      - name: Apply clang-format
        run: |
          find source engine/source -name "*.cpp" -o -name "*.h" | xargs clang-format -i -style=file

      - name: Commit fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        continue-on-error: true
        with:
          commit_message: "style: apply linting fixes"
        env:
          GITHUB_TOKEN: ${{ secrets.LINT_PAT }}

  get-version:
    name: Determine Next Version
    runs-on: [self-hosted, Linux, X64, definengine-linux]
    needs: lint
    outputs:
      new-version: ${{ steps.semantic.outputs.new_release_version }}
      new-release-published: ${{ steps.semantic.outputs.new_release_published }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Semantic Release (Dry Run)
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run semantic-release in dry-run mode to get the next version
          # We use npx to run the local version from package.json
          # Allow command to fail (e.g. no changes, authentication issues) without failing the job
          npx semantic-release --dry-run > release_output_raw.txt 2>&1 || true
          
          # Strip ANSI color codes for reliable parsing
          sed 's/\x1b\[[0-9;]*m//g' release_output_raw.txt > release_output.txt
          cat release_output.txt
          
          # Extract version from output if a new release is planned
          VERSION=$(grep -oP 'The next release version is \K[0-9]+\.[0-9]+\.[0-9]+' release_output.txt || echo "")
          
          if [ -n "$VERSION" ]; then
            echo "new_release_version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
            echo "No new version detected from semantic-release, checking git tags..."
            
            # Fallback to latest tag
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            
            if [ -n "$LATEST_TAG" ]; then
              # Strip optional v prefix
              CLEAN_TAG=${LATEST_TAG#v}
              echo "Found git tag: $LATEST_TAG, using version: $CLEAN_TAG"
              echo "new_release_version=$CLEAN_TAG" >> "$GITHUB_OUTPUT"
            else
              echo "No tag found. Defaulting to 0.0.1"
              echo "new_release_version=0.0.1" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    name: Build (${{ matrix.os }}, ${{ matrix.c_compiler }})
    runs-on: ${{ matrix.os == 'ubuntu-latest' && fromJSON('["self-hosted","Linux","X64","definengine-linux"]') || matrix.os }}
    needs: get-version

    strategy:
      fail-fast: false
      matrix:
        os: [
          ubuntu-latest,
          windows-latest,
          macos-latest
        ]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: gcc
          - os: macos-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        cmake --version
        ccache --version
        pkg-config --exists x11 xrandr xi wayland-client xkbcommon

    - name: Install Dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install ccache

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ matrix.os }}-${{ matrix.c_compiler }}
        variant: ccache

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_PROJECT_VERSION=${{ needs.get-version.outputs.new-version }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }}

    - name: Package
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: cpack -C ${{ matrix.build_type }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-${{ matrix.os }}-${{ matrix.c_compiler }}
        path: ${{ steps.strings.outputs.build-output-dir }}/DefinEngine-*.*

  documentation:
    name: Deploy Documentation
    runs-on: [self-hosted, Linux, X64, definengine-linux]
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          doxygen --version
          dot -V

      - name: Run Doxygen
        run: doxygen Doxyfile

      - name: Convert to Markdown
        run: |
          npm install -g moxygen
          mkdir -p wiki_content
          moxygen -o wiki_content/API.md docs/xml
          if [ ! -f wiki_content/Home.md ]; then
            echo "# Basic Game Engine Documentation" > wiki_content/Home.md
            echo "Welcome to the API documentation for the Basic Game Engine." >> wiki_content/Home.md
            echo "Check out the [API Documentation](API) page." >> wiki_content/Home.md
          fi

      - name: Deploy to Wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          path: wiki_content
          strategy: clone
      
      - name: Deploy to Pages
        uses: DenverCoder1/doxygen-github-pages-action@v2.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          
  release:
    name: Release
    runs-on: [self-hosted, Linux, X64, definengine-linux]
    needs: [build, get-version]
    # Only release on main, and only if build succeeded
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.get-version.outputs.new-release-published == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: package-*
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
